[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threatlens-webapp"
version = "0.1.0"
description = "Local web foundation for explainable multi-source IOC enrichment"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "requests>=2.31,<3",
  "rich>=13.7,<16",
  "python-dotenv>=1,<2",
  "tldextract>=5.1,<6",
  "filelock>=3.16,<4",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "ruff>=0.12,<1"]

[project.scripts]
threatlens-cli = "threatlens.cli:main"

[project.urls]
Repository = "https://github.com/AmirHo3ein138/ThreatLensWebapp"
Upstream = "https://github.com/AmirHo3ein138/SOC_Automation_Tools"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
threatlens = ["db/migrations/*.sql"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

